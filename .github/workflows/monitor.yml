name: Website Monitor

on:
  schedule:
    # The backup clock, not the main one.
    #
    # GitHub's scheduler drops what it cannot serve, and since 26 Aug 2026 it
    # serves about one tick in ten here: these three offset ticks an hour
    # produced 5-8 runs a day, hours apart, with no failed runs — the ticks
    # were simply never started. A dispatched run starts within seconds, so
    # the monitor is clocked from outside instead: a scheduler pings the
    # dashboard's /api/heartbeat every five minutes, and it dispatches a run
    # whenever the last check is 30 minutes old (README, "The heartbeat
    # endpoint"). These ticks remain for when that clock stops.
    #
    # Asking three times does not mean paying three times: the "Due for a
    # check?" step below drops any tick that lands too soon after the previous
    # check, at ~1 minute of runner time instead of a full run.
    - cron: "7 * * * *"
    - cron: "27 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "How long this run keeps checking (0 = one check and exit)"
        required: false
        default: "2"
      test_alert:
        description: "Send a test Telegram alert and exit, without checking anything"
        required: false
        type: boolean
        default: false
  # Fired by the dashboard: its "Run check" button, /check in Telegram, and
  # /api/heartbeat, which is what keeps the checks coming when the schedule
  # does not. repository_dispatch is used rather than workflow_dispatch
  # because it needs only the "Contents: write" token the dashboard already
  # has, not an extra "Actions: write" grant.
  repository_dispatch:
    types: [run-check]

# Only one monitoring run at a time, and never cancel a run that is mid-commit:
# two runs writing data/*.json concurrently is the one thing that can corrupt state.
concurrency:
  group: website-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Must exceed LOOP_MINUTES with room for checkout, fetching tsx and the last pass.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Runs that would repeat a check just made are given up here, before
      # the expensive steps. Two kinds qualify:
      #  - a scheduled tick landing less than MIN_GAP_MINUTES (45) after the
      #    last recorded check — the schedule asks three times an hour to get
      #    one run;
      #  - a heartbeat dispatch whose data is younger than the min_gap_minutes
      #    it carries. It was sent because the data was stale, so finding it
      #    fresh means another run got there first (a second pinger, a second
      #    Vercel instance).
      # The Run check button, /check and manual runs always go through.
      - name: Due for a check?
        id: gate
        env:
          MIN_GAP_MINUTES: ${{ vars.MIN_GAP_MINUTES }}
          DISPATCH_MIN_GAP: ${{ github.event.client_payload.min_gap_minutes }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Every unknown here decides in favour of checking: a gate that fails
          # closed would take monitoring down over an unreadable timestamp.
          gap=""
          if [ "$EVENT_NAME" = "schedule" ]; then
            gap="${MIN_GAP_MINUTES:-45}"
            case "$gap" in '' | *[!0-9]*) gap=45 ;; esac
          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            gap="${DISPATCH_MIN_GAP:-}"
            case "$gap" in *[!0-9]*) gap="" ;; esac
          fi

          last="$(jq -r '.updatedAt // empty' data/status.json 2>/dev/null || true)"
          # Not folded into one line: `date -d ""` does not fail, it returns
          # midnight, which would skip every run in the first 45 minutes of the
          # day whenever status.json is missing or unreadable.
          last_epoch=0
          if [ -n "$last" ]; then
            last_epoch="$(date -u -d "$last" +%s 2>/dev/null || echo 0)"
          fi

          if [ -z "$gap" ] || [ "$last_epoch" -le 0 ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Running (${EVENT_NAME})."
            exit 0
          fi

          age=$(( ( $(date -u +%s) - last_epoch ) / 60 ))
          if [ "$age" -lt "$gap" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Last check was ${age} min ago (< ${gap}) — leaving it to the run that already made it."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Last check was ${age} min ago (>= ${gap}) — running."
          fi

      # No `npm ci`: the monitor needs nothing from npm but tsx, which the
      # check step fetches on its own — a handful of packages instead of the
      # dashboard's 520. With a run every half hour, keeping each one inside a
      # single billed minute is what fits the cadence into the free Actions
      # allowance. tests/monitor-deps.test.ts keeps the monitor's imports free
      # of npm packages so this stays true.
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22

      # Carries the between-commit sample buffer from one run to the next, so
      # full resolution is kept without committing on every check.
      - name: Restore sample buffer
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .monitor-cache
          key: monitor-buffer-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            monitor-buffer-

      - name: Check websites
        id: check
        if: steps.gate.outputs.skip != 'true'
        # Pinned to the version in package-lock.json, which the Checks
        # workflow runs the tests with.
        run: npx --yes tsx@4.23.12 scripts/monitor.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional gate on /start. Without it, anyone who finds the bot can
          # subscribe and will then receive your hosts and their outage windows.
          TELEGRAM_SUBSCRIBE_PASSWORD: ${{ secrets.TELEGRAM_SUBSCRIBE_PASSWORD }}
          # Credentials for "login" monitors — one JSON object keyed by monitor
          # id, e.g. {"sharyn-kz":{"username":"...","password":"..."}}. Never
          # stored in data/monitors.json, which is public and committed.
          PORTAL_CREDENTIALS: ${{ secrets.PORTAL_CREDENTIALS }}
          # IANA zone for the times printed in Telegram alerts, e.g. Asia/Almaty.
          # Unset or invalid falls back to UTC. The zone is always shown.
          DISPLAY_TIMEZONE: ${{ vars.DISPLAY_TIMEZONE }}
          # How long this run keeps checking, and how often. A looping run
          # commits and pushes for itself as soon as a status changes.
          #
          # Deliberately small: runner time is metered on private repositories,
          # and the heartbeat starts a run every half hour, so each run is paid
          # for 40-45 times a day. At 1 minute this is one check per run — a
          # check every half hour, evenly spread. Raise it (repository variable
          # LOOP_MINUTES) to buy denser coverage inside each run, and watch the
          # bill — see the README.
          SEND_TEST_ALERT: ${{ inputs.test_alert }}
          LOOP_MINUTES: ${{ inputs.loop_minutes || github.event.client_payload.loop_minutes || vars.LOOP_MINUTES || '1' }}
          LOOP_INTERVAL_SECONDS: ${{ vars.LOOP_INTERVAL_SECONDS || '60' }}
          # Optional tuning — safe to leave unset.
          # CONFIRM_RETRIES: extra probes a failure has to survive before it is
          # believed (default 2, 0 alerts on the first miss). CONFIRM_DELAY_SECONDS
          # is the pause between them (default 10). Only failures a second look
          # could disagree with are retried — never a rejected sign-in.
          CONFIRM_RETRIES: ${{ vars.CONFIRM_RETRIES }}
          CONFIRM_DELAY_SECONDS: ${{ vars.CONFIRM_DELAY_SECONDS }}
          # REMINDER_INTERVAL_MINUTES: how often an outage that is still going
          # says so again (default 360, 0 announces it once and never again).
          REMINDER_INTERVAL_MINUTES: ${{ vars.REMINDER_INTERVAL_MINUTES }}
          # STALE_AFTER_MINUTES: how long a gap in checking has to be before the
          # run reports it to Telegram. Default 90 — long enough not to fire on
          # a single late tick, short enough to catch a stalled schedule.
          STALE_AFTER_MINUTES: ${{ vars.STALE_AFTER_MINUTES }}
          COMMIT_INTERVAL_MINUTES: ${{ vars.COMMIT_INTERVAL_MINUTES }}
          CHECK_TIMEOUT_MS: ${{ vars.CHECK_TIMEOUT_MS }}
          HISTORY_RETENTION_DAYS: ${{ vars.HISTORY_RETENTION_DAYS }}

      - name: Save sample buffer
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: .monitor-cache
          key: monitor-buffer-${{ github.run_id }}-${{ github.run_attempt }}

      # A looping run pushes as it goes; this catches anything left on disk when
      # the window ends, and is the only commit path when LOOP_MINUTES is 0.
      - name: Commit any remaining results
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing left to commit."
            exit 0
          fi
          git commit -m "chore(monitor): ${{ steps.check.outputs.reason || 'final state' }}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push failed, rebasing and retrying (attempt $attempt)..."
            sleep $((attempt * 3))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "Could not push monitoring results after 5 attempts." >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Website Monitor"
            echo ""
            if [ "${{ steps.gate.outputs.skip }}" = "true" ]; then
              echo "- Result: skipped — a recent check already covered it"
              exit 0
            fi
            echo "- Result: ${{ steps.check.outputs.summary || 'run did not complete' }}"
            echo "- Last state: ${{ steps.check.outputs.reason || 'n/a' }}"
          } >> "$GITHUB_STEP_SUMMARY"

name: Website Monitor

on:
  schedule:
    # Hourly, not every three minutes.
    #
    # GitHub's scheduler does not honour short crons: a "*/3" schedule was
    # observed firing every 20-60 minutes, silently dropping the ticks between.
    # Hourly schedules are honoured reliably, so the run itself does the
    # three-minute checking (see LOOP_MINUTES below) instead of asking the
    # scheduler for it.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "How long this run keeps checking (0 = one check and exit)"
        required: false
        default: "50"

# Only one monitoring run at a time, and never cancel a run that is mid-commit:
# two runs writing data/*.json concurrently is the one thing that can corrupt state.
concurrency:
  group: website-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Must exceed LOOP_MINUTES with room for checkout, install and the last pass.
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Carries the between-commit sample buffer from one run to the next, so
      # full resolution is kept without committing on every check.
      - name: Restore sample buffer
        uses: actions/cache/restore@v4
        with:
          path: .monitor-cache
          key: monitor-buffer-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            monitor-buffer-

      - name: Check websites
        id: check
        run: npx tsx scripts/monitor.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # How long this run keeps checking, and how often. A looping run
          # commits and pushes for itself as soon as a status changes.
          LOOP_MINUTES: ${{ inputs.loop_minutes || vars.LOOP_MINUTES || '50' }}
          LOOP_INTERVAL_SECONDS: ${{ vars.LOOP_INTERVAL_SECONDS || '180' }}
          # Optional tuning — safe to leave unset.
          COMMIT_INTERVAL_MINUTES: ${{ vars.COMMIT_INTERVAL_MINUTES }}
          CHECK_TIMEOUT_MS: ${{ vars.CHECK_TIMEOUT_MS }}
          HISTORY_RETENTION_DAYS: ${{ vars.HISTORY_RETENTION_DAYS }}

      - name: Save sample buffer
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-cache
          key: monitor-buffer-${{ github.run_id }}-${{ github.run_attempt }}

      # A looping run pushes as it goes; this catches anything left on disk when
      # the window ends, and is the only commit path when LOOP_MINUTES is 0.
      - name: Commit any remaining results
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing left to commit."
            exit 0
          fi
          git commit -m "chore(monitor): ${{ steps.check.outputs.reason || 'final state' }}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push failed, rebasing and retrying (attempt $attempt)..."
            sleep $((attempt * 3))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "Could not push monitoring results after 5 attempts." >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Website Monitor"
            echo ""
            echo "- Result: ${{ steps.check.outputs.summary || 'run did not complete' }}"
            echo "- Last state: ${{ steps.check.outputs.reason || 'n/a' }}"
          } >> "$GITHUB_STEP_SUMMARY"
